name: "dm2_aikya"
version: "1.0.0"
config-version: 2

profile: "default"

# Variables
vars:
  raw_data_project: 'dm2-project-479611'
  raw_data_dataset: 'dm2_aikya'
  staging_dataset: 'dm2_aikya_stg'
  analytics_dataset: 'dm2_aikya_analytics'

# File paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  dm2_aikya:
    
    # Staging models - views
    staging:
      +materialized: view
      +schema: "{{ var('staging_dataset') }}"
    
    # Dimension models - tables  
    dimensions:
      +materialized: table
      +schema: "{{ var('analytics_dataset') }}"
    
    # Fact models - tables
    facts:
      +materialized: table  
      +schema: "{{ var('analytics_dataset') }}"
    
    # Mart models - tables (for Tableau)
    marts:
      +materialized: table
      +schema: "{{ var('analytics_dataset') }}"