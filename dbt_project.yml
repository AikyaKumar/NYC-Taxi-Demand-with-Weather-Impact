name: "dm2_aikya"
version: "1.0.0"
config-version: 2

profile: "default"

# NO VARIABLES SECTION - remove it completely

model-paths: ["models"]
clean-targets:
  - "target"
  - "dbt_packages"

# REMOVE the dispatch section - it's causing issues

# --- MODEL CONFIGURATION ---
# Top-level key must match the project name above
models:
  dm2_aikya:
    # 1. STAGING MODELS
    staging:
      +materialized: view
      +schema: dm2_staging  # Fixed schema name
    
    dimensions:
      +materialized: table
      +schema: "dm2_analytics"
    
    fact:
      +materialized: table
      +schema: "dm2_analytics"

    mart:
      +materialized: table
      +schema: "dm2_analytics"

flags:
  require_generic_test_arguments_property: true