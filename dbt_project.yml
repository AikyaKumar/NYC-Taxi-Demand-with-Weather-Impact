# ────────────────────────────────────────────────────────────────────────────────
# dbt_project.yml
# ────────────────────────────────────────────────────────────────────────────────

name: "dm2_aikya"
version: "1.0.0"
config-version: 2

profile: "default"

# --- Variables for Data Locations ---
vars:
  raw_data_project: 'dm2-project-479611'
  raw_data_dataset: 'dm2_aikya'
  # COMMENT OUT THESE FOR NOW:
  # staging_dataset: 'dm2_aikya_stg'
  # analytics_dataset: 'dm2_aikya_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ────────────────────────────────────────────────────────────────────────────────
# Model configurations - HARDCODE VALUES
# ────────────────────────────────────────────────────────────────────────────────

models:
  dm2_aikya:
    # ──────────────── Source references ────────────────
    src:
      +materialized: ephemeral
    
    # ────────────── Staging layer ───────────────
    staging:
      +materialized: view
      +schema: "dm2_aikya_stg"                    # Hardcoded
    
    # ──────────── Dimension tables ───────────────
    dimensions:
      +materialized: table
      +schema: "dm2_aikya_analytics"              # Hardcoded
    
    # ────────────── Fact tables ──────────────────
    facts:
      +materialized: table
      +schema: "dm2_aikya_analytics"              # Hardcoded
    
    # ────────────── Mart tables ──────────────────
    marts:
      +materialized: table
      +schema: "dm2_aikya_analytics"              # Hardcoded
    
    # ─────────── Default for any other models ───────
    +materialized: view
    +schema: "dm2_aikya_analytics"                # Hardcoded