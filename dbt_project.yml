# dbt_project.yml - FINAL SIMPLE VERSION
name: "dm2_aikya"
version: "1.0.0"
config-version: 2

profile: "default"

# Variables for SOURCES only (these WILL work in schema.yml)
vars:
  raw_data_project: 'dm2-project-479611'
  raw_data_dataset: 'dm2_aikya'
  analytics_dataset: 'dm2_aikya_analytics'

model-paths: ["models"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Simple hardcoded config
models:
  dm2_aikya:
    staging:
      +materialized: view
      +schema: "dm2_aikya_stg"
    
    dimensions:
      +materialized: table
      +schema: "dm2_aikya_analytics"
    
    facts:
      +materialized: table  
      +schema: "dm2_aikya_analytics"
    
    marts:
      +materialized: table
      +schema: "dm2_aikya_analytics"