# models/facts/schema.yml

version: 2

models:
  - name: fact_taxi_trips
    description: "The core fact table for taxi trips, combining calculated metrics and Foreign Keys to all Dimension tables."
    columns:
      - name: trip_sk
        description: "Primary key of the fact table (from staging)."
      - name: vendor_sk
        description: "Foreign key to dim_vendors (Vendor ID)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_vendors')
              field: vendor_sk
      - name: pickup_location_sk
        description: "Foreign key to dim_locations (Pickup Location ID)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_locations')
              field: location_sk
      - name: dropoff_location_sk
        description: "Foreign key to dim_locations (Dropoff Location ID)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_locations')
              field: location_sk
      - name: pickup_date_time_sk
        description: "Foreign key to dim_date_time (Pickup Timestamp, truncated to hour)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date_time')
              field: date_time_sk
      - name: weather_sk
        description: "Foreign key to dim_weather (Weather record ID at time of pickup)."
        tests:
          - relationships:
              to: ref('dim_weather')
              field: weather_sk
      - name: trip_duration_minutes
        description: "Calculated duration of the trip in minutes."
      - name: passenger_count
        description: "Number of passengers (core metric)."
      - name: total_amount
        description: "The final total charged (core metric)."
      - name: total_amount_check
        description: "Validation column: sum of components. Should equal total_amount."
      - name: tip_amount
        description: "Tip amount (key analytical metric)."