models:
  - name: stg_taxi_trips
    description: "Staging table for cleaned and standardized yellow taxi trip data."
    config:
      tags: ["staging", "taxi", "cleaned"]
    columns:
      - name: trip_sk
        description: "Trip surrogate key (Primary Key)"
      
      - name: vendor_id
        description: "Taxi vendor code (1=CMT, 2=Verifone) - Mapped and cleaned."
        tests:
          - not_null
              
      - name: pickup_timestamp
        description: "Trip pickup datetime (TIMESTAMP)"
        tests:
          - not_null
          
      - name: dropoff_timestamp
        description: "Trip dropoff datetime (TIMESTAMP)"
        
      - name: pickup_hour
        description: "Pickup hour timestamp (truncated to the hour, TIMESTAMP)"
        tests:
          - not_null
          
      - name: pickup_location_id
        description: "Taxi Zone ID where the trip started (Foreign Key)"
        tests:
          - not_null
          
      - name: dropoff_location_id
        description: "Taxi Zone ID where the trip ended"
        
      - name: passenger_count
        description: "Number of passengers"
        
      - name: trip_distance
        description: "Trip distance in miles"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0 # Must be greater than 0 due to filtering
              max_value: 3000 # Adjust max_value if 100 is too low/high for valid data
              
      - name: total_amount
        description: "Total amount charged to the customer"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0 # Must be greater than 0 due to filtering
              max_value: 1500  # Adjust as needed (was 1104.59 max in raw data)
              
      - name: payment_type
        description: "Payment type code"
        
      # Ensure all other columns selected in the SQL are listed here:
      - name: rate_code_id
        description: "Rate code applied at time of ride"
      - name: store_and_forward_flag
        description: "Indicates if trip record was held in vehicle memory"
      - name: fare_amount
        description: "The time-and-distance fare"
      - name: extra
        description: "Extra charges"
      - name: mta_tax
        description: "MTA tax"
      - name: tip_amount
        description: "Tip amount"
      - name: tolls_amount
        description: "Toll charges"
      - name: improvement_surcharge
        description: "Improvement surcharge"