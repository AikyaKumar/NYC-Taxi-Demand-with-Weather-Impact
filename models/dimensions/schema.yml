# models/dimensions/schema.yml
version: 2

models:
  - name: dim_date
    description: "Date dimension table with weather-relevant attributes for time-based analysis"
    config:
      tags: ["dimension", "date", "weather-analysis"]
    columns:
      - name: date_key
        description: "Date primary key (YYYY-MM-DD)"
        tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year"
      - name: month_name
        description: "Full month name"
      - name: day_name
        description: "Full day name"
      - name: is_weekend
        description: "TRUE if Saturday or Sunday"
      - name: is_holiday
        description: "TRUE if NYC holiday (affects taxi demand)"
      - name: season
        description: "Season (Winter, Spring, Summer, Fall)"
      - name: tourism_season
        description: "Tourist season classification"
  
  - name: dim_date_time
    description: "DateTime dimension for precise timestamp analysis with weather sensitivity"
    config:
      tags: ["dimension", "time", "weather-analysis"]
    columns:
      - name: datetime_sk
        description: "Surrogate key for datetime"
        tests:
          - unique
          - not_null
      - name: datetime_key
        description: "Original timestamp"
      - name: hour_of_day
        description: "Hour (0-23)"
      - name: peak_time_band
        description: "Traffic time band (Morning Rush, Evening Rush, Off-Peak)"
      - name: weather_sensitivity_level
        description: "Weather impact sensitivity (High, Medium, Low)"
      - name: business_leisure_band
        description: "Business vs leisure hours classification"
  
  - name: dim_weather_conditions
    description: "Weather conditions dimension with human-readable descriptions and severity ratings"
    config:
      tags: ["dimension", "weather", "core"]
    columns:
      - name: weather_sk
        description: "Surrogate key for weather conditions"
        tests:
          - unique
          - not_null
      - name: weather_code
        description: "Original WMO weather code"
      - name: weather_description
        description: "Human-readable weather description"
      - name: weather_category
        description: "Weather category for analysis (Clear, Rain, Snow, etc.)"
      - name: weather_severity
        description: "Severity rating (Good, Fair, Poor, Severe)"
      - name: is_rainy
        description: "TRUE if weather involves rain"
      - name: is_snowy
        description: "TRUE if weather involves snow"
  
  - name: dim_taxi_zones
    description: "Taxi zone dimension with geographic and urban characteristics for weather impact analysis"
    config:
      tags: ["dimension", "geography", "zones"]
    columns:
      - name: zone_sk
        description: "Surrogate key for taxi zone"
        tests:
          - unique
          - not_null
      - name: location_id
        description: "Original location identifier"
      - name: borough
        description: "NYC borough"
        tests:
          - not_null
      - name: zone_name
        description: "Taxi zone name"
        tests:
          - not_null
      - name: urban_density_category
        description: "Urban density classification"
      - name: estimated_weather_impact
        description: "Estimated weather impact based on zone characteristics"
  
  - name: dim_time_of_day
    description: "Time of day dimension for hourly pattern analysis"
    config:
      tags: ["dimension", "time", "hourly"]
    columns:
      - name: hour_key
        description: "Hour of day (0-23)"
        tests:
          - unique
          - not_null
      - name: time_band
        description: "Time band classification"
      - name: commute_period
        description: "Commute vs non-commute hours"
      - name: weather_sensitivity_band
        description: "Weather sensitivity classification"
  
  - name: dim_vendor
    description: "Taxi vendor dimension with fleet characteristics for weather response analysis"
    config:
      tags: ["dimension", "vendor", "fleet"]
    columns:
      - name: vendor_sk
        description: "Surrogate key for vendor"
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: "Original vendor code"
      - name: vendor_name
        description: "Full vendor name"
      - name: fleet_size_category
        description: "Fleet size classification"
      - name: weather_response_capability
        description: "Estimated weather response capability"
  
  - name: dim_payment_type
    description: "Payment type dimension with weather behavior characteristics"
    config:
      tags: ["dimension", "payment", "behavior"]
    columns:
      - name: payment_sk
        description: "Surrogate key for payment type"
        tests:
          - unique
          - not_null
      - name: payment_type
        description: "Original payment code"
      - name: payment_method
        description: "Payment method description"
      - name: weather_payment_category
        description: "Weather resilience classification"
      - name: transaction_speed_category
        description: "Transaction speed classification"