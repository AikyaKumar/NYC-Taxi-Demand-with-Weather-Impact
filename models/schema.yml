version: 2

sources:
  - name: dm2_aikya_raw # Logical name for the source dataset
    description: "Raw data landing zone for NYC Taxi and Weather data from the dm2_aikya_raw dataset."
    database: "{{ var('raw_data_project') }}" 
    schema: "{{ var('raw_data_dataset') }}" 

    tables:
      - name: nyc_yellow_taxi_trips_raw
        description: "Contains detailed records for each NYC yellow taxi trip, including pickup/dropoff times, fares, and location IDs."
      - name: nyc_taxi_zones_raw
        description: "Mapping table that links Location IDs (LADs) to corresponding Borough and Zone names for contextual analysis."
      - name: nyc_weather_raw
        description: "Hourly historical weather data for New York City, featuring metrics like temperature, rain, and snowfall."